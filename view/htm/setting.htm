<script>
(function () {
	var table = document.getElementById('mfl-table');
	var addBtn = document.getElementById('mfl-add');
	if (!table || !addBtn) return;
	function nextIdx() {
		var max = -1;
		table.querySelectorAll('tbody tr').forEach(function (tr) {
			var idx = parseInt(tr.getAttribute('data-idx') || '0', 10);
			if (idx > max) max = idx;
		});
		return max + 1;
	}
	function reindexName(el, idx) {
		if (!el.name) return;
		el.name = el.name.replace(/\[\d+\]/, '[' + idx + ']');
	}
	addBtn.addEventListener('click', function () {
		var tbody = table.querySelector('tbody');
		var last = tbody.querySelector('tr:last-child');
		if (!last) return;
		var idx = nextIdx();
		var clone = last.cloneNode(true);
		clone.setAttribute('data-idx', String(idx));
		clone.querySelectorAll('input').forEach(function (input) {
			reindexName(input, idx);
			if (input.type === 'checkbox') {
				input.checked = input.name.indexOf('show_footer') >= 0;
			} else if (input.type === 'hidden' && input.name.indexOf('show_') === 0) {
				input.value = '0';
			} else if (input.name.indexOf('lid[') === 0) {
				input.value = '0';
			} else if (input.type === 'number') {
				input.value = '0';
			} else if (input.type !== 'hidden') {
				input.value = '';
			}
		});
		tbody.appendChild(clone);
	});
	table.addEventListener('click', function (e) {
		var btn = e.target.closest('.mfl-del');
		if (!btn) return;
		var rows = table.querySelectorAll('tbody tr');
		if (rows.length <= 1) {
			btn.closest('tr').querySelectorAll('input').forEach(function (input) {
				if (input.type === 'checkbox') input.checked = false;
				else if (input.name && input.name.indexOf('lid[') === 0) input.value = '0';
				else if (input.type === 'hidden' && input.name && input.name.indexOf('show_') === 0) input.value = '0';
				else if (input.type !== 'hidden') input.value = '';
			});
			return;
		}
		btn.closest('tr').remove();
	});
})();
</script>
